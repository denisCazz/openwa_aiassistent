# OpenWA — stack semplificato per deploy su Coolify / VPS
# Avvio: docker compose -f docker-compose.coolify.yml up -d --build
#
# Variabili richieste in Coolify:
#   OPENAI_API_KEY=sk-...
# Opzionali:
#   API_MASTER_KEY=...
#   OPENAI_MODEL=gpt-4o
#   REPLY_LANGUAGE=italiano

services:
  openwa-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openwa-api
    restart: unless-stopped
    expose:
      - '2785'
    environment:
      - NODE_ENV=production
      - PORT=2785
      - DATABASE_TYPE=sqlite
      - DATABASE_NAME=/app/data/openwa.sqlite
      - DATABASE_SYNCHRONIZE=true
      - ENGINE_TYPE=whatsapp-web.js
      - SESSION_DATA_PATH=/app/data/sessions
      - PUPPETEER_HEADLESS=true
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/media
      - API_MASTER_KEY=${API_MASTER_KEY:-}
    volumes:
      - openwa-data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:2785/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: openwa-ai
    restart: unless-stopped
    expose:
      - '3100'
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENWA_BASE_URL=http://openwa-api:2785
      - OPENWA_API_KEY=${API_MASTER_KEY:-}
      - PORT=3100
      - HISTORY_LIMIT=30
      - REPLY_LANGUAGE=${REPLY_LANGUAGE:-italiano}
    depends_on:
      openwa-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3100/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: openwa-dashboard
    restart: unless-stopped
    ports:
      - '${DASHBOARD_PORT:-2886}:80'
    depends_on:
      openwa-api:
        condition: service_healthy
      ai-service:
        condition: service_healthy

volumes:
  openwa-data:
    driver: local

networks:
  default:
    name: openwa-network
